<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollow Fox</title>
<meta name="description" content="Hollow Fox makes games. Coming soon.">
<style>
  :root { color-scheme: dark; --bg: #0d0b12; --fg: #ece6f2; --muted: #9a90a8; --accent: #e8743b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(ellipse at 50% 30%, #1d1726 0%, var(--bg) 70%); color: var(--fg);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; }
  main { max-width: 520px; }
  h1 { font-size: clamp(2.2rem, 8vw, 3.4rem); letter-spacing: 0.04em; margin: 0 0 8px; font-weight: 800; }
  h1 span { color: var(--accent); }
  p { margin: 0 0 8px; color: var(--muted); }
  .soon { display: inline-block; margin-top: 20px; padding: 6px 14px; border: 1px solid #3a3146; border-radius: 999px;
          font-size: 0.8rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Hollow <span>Fox</span></h1>
  <p>Games, made by one person after hours.</p>
  <span class="soon">Coming soon</span>
</main>
</body>
</html>
